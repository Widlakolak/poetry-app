services:
  poetryapp-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  poetryapp-backend:
    image: ghcr.io/widlakolak/poetry-app/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://poetryapp-postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      MEDIA_MAX_FILE_SIZE_BYTES: ${MEDIA_MAX_FILE_SIZE_BYTES:-2147483648}
    volumes:
      - ./incoming:/data/incoming:ro
      - ./media:/data/media:rw
    depends_on:
      poetryapp-postgres:
        condition: service_healthy
    networks:
      - database
      - shared-net
    security_opt:
      - no-new-privileges:true

  poetryapp-frontend:
    image: ghcr.io/widlakolak/poetry-app/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - poetryapp-backend
    networks:
      - shared-net
    security_opt:
      - no-new-privileges:true

networks:
  database:
    internal: true
  shared-net:
    external: true
    name: poetrystream_shared-net
