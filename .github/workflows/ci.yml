name: CI

on:
  pull_request:
    branches:
      - main
      - codex/stage-1-home-screen
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish-images.yml"
      - "compose.yaml"
      - ".env.example"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate deployment Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f compose.yaml config --quiet

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build frontend container image
        run: docker build --pull -t poetry-app-frontend:ci ./frontend

  backend-test:
    name: Backend tests and container build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test

      - name: Build backend container image
        run: docker build --pull -t poetry-app-backend:ci ./backend
